name: CI

on:
  push:
    branches: [main, fix/current-upstream-string-validation]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install protoc
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: protoc
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - name: Run tests
        run: cargo test --workspace --all-targets
      - name: Verify package contents
        run: cargo package --list --locked --workspace

  conformance:
    # The upstream protovalidate-conformance harness against the dispatch
    # binary. The pinned release is required; upstream main is reported so
    # new cases show up before they are released.
    name: Conformance (protovalidate ${{ matrix.harness }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: ${{ matrix.harness == 'main' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        harness: ["v1.2.2", "main"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install protoc and Go
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: protoc go
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - name: Install the conformance harness
        env:
          HARNESS: ${{ matrix.harness }}
        run: GOBIN="${RUNNER_TEMP}/bin" go install "github.com/bufbuild/protovalidate/tools/protovalidate-conformance@${HARNESS}"
      - name: Build the dispatch binary
        run: cargo build --locked --release -p protovalidate-buffa-conformance
      - name: Run the conformance suite
        run: '"${RUNNER_TEMP}/bin/protovalidate-conformance" target/release/protovalidate-buffa-conformance'

  msrv:
    name: Rust 1.88.0
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install protoc
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: protoc
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - name: Check minimum supported Rust version
        run: rustup run 1.88.0 cargo check --locked --workspace

  prebuilt:
    permissions:
      contents: read
    name: Verify prebuilt distribution
    uses: ./.github/workflows/prebuilt.yml
