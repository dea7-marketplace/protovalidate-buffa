name: CI

# Dea7's line of protovalidate-buffa. The organisation allows GitHub-owned
# actions plus an allowlist, so protoc is installed from its release archive
# (checksum-verified) and Go through actions/setup-go rather than mise-action.
# Prebuilt binaries are upstream's release concern: Dea7 builds the generator
# as a Cargo build dependency.

on:
  push:
    branches: [main, fix/current-upstream-string-validation]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PROTOC_VERSION: "36.0"
  PROTOC_SHA256: bc8211ce760bd43ee21ddc145d6d9dbaeeabae205267a79d9054a240e367d4b4

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install protoc
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/protoc.zip"
          curl -fsSL "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip" -o "${archive}"
          echo "${PROTOC_SHA256}  ${archive}" | sha256sum --check
          unzip -q "${archive}" -d "${RUNNER_TEMP}/protoc"
          echo "${RUNNER_TEMP}/protoc/bin" >>"${GITHUB_PATH}"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - name: Run tests
        run: cargo test --locked --workspace --all-targets

  conformance:
    # The upstream protovalidate-conformance harness against the dispatch
    # binary. The pinned release is required; upstream main is reported so
    # new cases show up before they are released.
    name: Conformance (protovalidate ${{ matrix.harness }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: ${{ matrix.harness == 'main' }}
    strategy:
      fail-fast: false
      matrix:
        harness: ["v1.2.2", "main"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install protoc
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/protoc.zip"
          curl -fsSL "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip" -o "${archive}"
          echo "${PROTOC_SHA256}  ${archive}" | sha256sum --check
          unzip -q "${archive}" -d "${RUNNER_TEMP}/protoc"
          echo "${RUNNER_TEMP}/protoc/bin" >>"${GITHUB_PATH}"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.0"
          cache: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - name: Install the conformance harness
        env:
          HARNESS: ${{ matrix.harness }}
        run: GOBIN="${RUNNER_TEMP}/bin" go install "github.com/bufbuild/protovalidate/tools/protovalidate-conformance@${HARNESS}"
      - name: Build the dispatch binary
        run: cargo build --locked --release -p protovalidate-buffa-conformance
      - name: Run the conformance suite
        run: '"${RUNNER_TEMP}/bin/protovalidate-conformance" target/release/protovalidate-buffa-conformance'
